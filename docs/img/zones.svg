<text x="36" y="424" class="h">Tuning between melodic zones</text>
<text x="36" y="446" class="t">Each melodic sample has a root (pitch class) and a fine tune in cents (−50…+50). The web editor detects both</text>
<text x="36" y="464" class="t">(SELECTED → KEYS, or EDIT → DETECT PITCH). The engine adds the tune to the pitch of every note, so</text>
<text x="36" y="482" class="t">Tape Key (−14 ct), Shiny (−2 ct) and Phonk (0 ct) all land on the same scale notes.</text>
</svg>