plugins { id 'com.android.application' }
android {
    namespace 'com.ferluht.lofi'
    compileSdk 34
    defaultConfig { applicationId 'com.ferluht.lofi'; minSdk 23; targetSdk 30; versionCode 1; versionName "0.1" }
    signingConfigs { debug { enableV1Signing = true; enableV2Signing = true } }
    defaultConfig { externalNativeBuild { cmake { cFlags '-O2' } }; ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' } }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    ndkVersion '27.2.12479018'
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
